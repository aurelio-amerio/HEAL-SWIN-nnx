[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "heal-swin-nnx"
version = "0.2.0"
description = "HealSwin: spherical HEALPix Swin V2 U-Net in JAX/Flax NNX, with RoPE and seam-exact shifted windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "flax>=0.12.7",
    "healpy>=1.19.0",
    "jax>=0.11.1",
    "numpy>=2.5.1",
]

[project.urls]
Homepage = "https://github.com/aurelio-amerio/HEAL-SWIN-nnx"
Issues = "https://github.com/aurelio-amerio/HEAL-SWIN-nnx/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu",
    # jaxlib >= 0.12 lets XNNPACK pick CPU-specific f32 dot kernels (google/XNNPACK#11736), so rounding
    # differs between CI runners and dev machines. Request CPU-consistent arithmetic (same flag as
    # GenSBI) so a CI numerics failure reproduces locally. Accepted by jax >= 0.11.1.
    "XLA_FLAGS=--xla_cpu_enable_platform_dependent_math=false --xla_force_host_platform_device_count=8",
]
markers = [
    "sharding: multi-device sharding tests (those marked requires_8_devices skip with fewer than 8 devices)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
examples = [
    "grain>=0.2.18",
    "notebook>=7.6.0",
    "datasets>=5.0.0",
    "matplotlib>=3.9.0",
    "scipy>=1.15.0",
]

cuda12 = [
    "jax[cuda12]>=0.11.1",
    "nvidia-cudnn-cu12<9.11.0",
]

cuda13 = [
    "jax[cuda13]>=0.11.1"
]
